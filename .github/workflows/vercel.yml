name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  SITE_URL: https://xoraevents.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Trigger Vercel production build
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::error::أضف سراً واحداً فقط في GitHub → Settings → Secrets → VERCEL_DEPLOY_HOOK"
            echo "::error::أنشئه من: Vercel → Project → Settings → Git → Deploy Hooks → main → Production"
            echo "::error::أو اربط الريبو مباشرة من vercel.com (New Project) وتجاهل هذا الـ workflow."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "Vercel build triggered."

      - name: Wait for Vercel (build + deploy)
        run: sleep 75

      - name: Smoke test
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 -L "${SITE_URL}/ar")"
            echo "Attempt ${attempt}: GET ${SITE_URL}/ar → ${code}"
            case "${code}" in
              200|301|302|307|308) exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::Site not ready at ${SITE_URL}/ar after Vercel deploy."
          exit 1
