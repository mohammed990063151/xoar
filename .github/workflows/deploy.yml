name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/cjfyc2evye0k/public_html/xoraevents.com/xoar
  SITE_URL: https://xoraevents.com
  API_PROXY_TARGET: https://xoraplus.com
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_GTM_ID: GTM-TX7NM96K

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure production URLs
        run: |
          {
            echo "API_PROXY_TARGET=${API_PROXY_TARGET}"
            echo "NEXT_PUBLIC_API_URL=${API_PROXY_TARGET}"
            echo "NEXT_PUBLIC_ADMIN_URL=${API_PROXY_TARGET}"
            echo "NEXT_PUBLIC_PORTAL_URL=${API_PROXY_TARGET}"
            echo "NEXT_PUBLIC_SITE_URL=${SITE_URL}"
            echo "NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}"
          } >> "$GITHUB_ENV"

      - name: Build Next.js (webpack)
        run: npm run build
        env:
          NODE_ENV: production
          SKIP_API_DURING_BUILD: "1"

      - name: Validate build output
        run: |
          set -euo pipefail
          chmod +x scripts/verify-deployment.sh scripts/backup-deployment.sh scripts/rollback-deployment.sh scripts/fix-deploy-permissions.sh scripts/server-next-check.sh scripts/resolve-server-node.sh scripts/server-npm-ci.sh scripts/merge-server-env.sh scripts/passenger-diag.sh
          DEPLOY_PATH="." MODE=ci scripts/verify-deployment.sh
          echo "Local BUILD_ID=$(cat .next/BUILD_ID)"

      - name: Prepare server .env for deploy
        run: |
          set -euo pipefail
          {
            echo "API_PROXY_TARGET=${API_PROXY_TARGET}"
            echo "NEXT_PUBLIC_API_URL=${API_PROXY_TARGET}"
            echo "NEXT_PUBLIC_ADMIN_URL=${API_PROXY_TARGET}"
            echo "NEXT_PUBLIC_PORTAL_URL=${API_PROXY_TARGET}"
            echo "NEXT_PUBLIC_SITE_URL=${SITE_URL}"
            echo "NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}"
            if [ -n "${{ secrets.FRONTEND_API_KEY }}" ]; then
              echo "FRONTEND_API_KEY=${{ secrets.FRONTEND_API_KEY }}"
            fi
          } > .env.deploy
          echo "Prepared .env.deploy (redacted)."

      - name: Setup SSH
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_PRIVATE_KEY SSH_HOST SSH_PORT SSH_USERNAME; do
            value="${!name:-}"
            if [ -z "${value}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [ "${missing}" -eq 1 ]; then
            echo "::error::Add secrets at Settings → Secrets and variables → Actions"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/id_ed25519; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key (expected PEM/OpenSSH format)"
            exit 1
          fi

          # ssh-keyscan may fail on some hosts; SSH uses StrictHostKeyChecking=no anyway.
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"
          echo "Testing SSH to ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }} ..."
          if ! ssh ${SSH_OPTS} "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" "echo SSH_OK"; then
            echo "::error::SSH connection failed. Check SSH_HOST, SSH_PORT, SSH_USERNAME, and SSH_PRIVATE_KEY."
            exit 1
          fi
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

      - name: Pre-deploy server checks
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          ssh $SSH_OPTS "$HOST" "test -d '${DEPLOY_PATH}'" \
            || { echo "::error::Deploy path missing on server: ${DEPLOY_PATH}"; exit 1; }

          if ssh $SSH_OPTS "$HOST" "test -f '${DEPLOY_PATH}/.env'"; then
            echo "Server .env found."
            if ssh $SSH_OPTS "$HOST" "grep -qE '^NODE_ENV=' '${DEPLOY_PATH}/.env'"; then
              echo "::warning::Removing NODE_ENV from server .env (Next.js rejects non-standard values)."
              ssh $SSH_OPTS "$HOST" "grep -vE '^NODE_ENV=' '${DEPLOY_PATH}/.env' > '${DEPLOY_PATH}/.env.tmp' && mv '${DEPLOY_PATH}/.env.tmp' '${DEPLOY_PATH}/.env'"
            fi
          else
            echo "No .env yet — will be created during deploy from CI env."
          fi

      - name: Backup live release on server
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          rsync -avz -e "ssh $SSH_OPTS" \
            scripts/backup-deployment.sh scripts/rollback-deployment.sh \
            scripts/fix-deploy-permissions.sh scripts/server-next-check.sh \
            scripts/resolve-server-node.sh scripts/server-npm-ci.sh scripts/merge-server-env.sh \
            "$HOST:${DEPLOY_PATH}/scripts/"

          ssh $SSH_OPTS "$HOST" \
            "chmod +x '${DEPLOY_PATH}/scripts/backup-deployment.sh' '${DEPLOY_PATH}/scripts/rollback-deployment.sh' && DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/backup-deployment.sh'"

      - name: Deploy build artifacts to server
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          ssh $SSH_OPTS "$HOST" "mkdir -p '${DEPLOY_PATH}/.next' '${DEPLOY_PATH}/public' '${DEPLOY_PATH}/tmp' '${DEPLOY_PATH}/scripts'"

          echo "Syncing .next/"
          rsync -avz --delete --info=stats2 -e "ssh $SSH_OPTS" \
            .next/ "$HOST:${DEPLOY_PATH}/.next/"

          echo "Verifying .next on server immediately after rsync"
          ssh $SSH_OPTS "$HOST" "test -f '${DEPLOY_PATH}/.next/BUILD_ID' && ls -la '${DEPLOY_PATH}/.next/BUILD_ID'"

          echo "Syncing public/"
          rsync -avz --delete --info=stats2 -e "ssh $SSH_OPTS" \
            public/ "$HOST:${DEPLOY_PATH}/public/"

          echo "Syncing runtime files"
          rsync -avz --info=stats2 -e "ssh $SSH_OPTS" \
            package.json package-lock.json next.config.mjs server.js app.js .htaccess \
            "$HOST:${DEPLOY_PATH}/"

          echo "Syncing scripts/"
          rsync -avz --info=stats2 -e "ssh $SSH_OPTS" \
            scripts/ "$HOST:${DEPLOY_PATH}/scripts/"

          echo "Ensure server .env (merge deploy keys into existing .env)"
          rsync -avz --info=stats2 -e "ssh $SSH_OPTS" \
            .env.deploy "$HOST:${DEPLOY_PATH}/.env.deploy"
          ssh $SSH_OPTS "$HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/merge-server-env.sh'"

          echo "Install node_modules on server (matches cPanel Node / Passenger)"
          ssh $SSH_OPTS "$HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/server-npm-ci.sh'"

          ssh $SSH_OPTS "$HOST" \
            "chmod +x '${DEPLOY_PATH}/scripts/'*.sh && DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/fix-deploy-permissions.sh'"

      - name: Server-side Next.js prepare check (before Passenger restart)
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          if ssh $SSH_OPTS "$HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/server-next-check.sh'"; then
            echo "New build passes server checks — safe to restart Passenger."
            exit 0
          fi

          echo "::warning::New build failed next.prepare() — rolling back WITHOUT restarting Passenger."
          ssh $SSH_OPTS "$HOST" \
            "SKIP_PASSENGER_RESTART=1 DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/rollback-deployment.sh'"

          sleep 10

          if ssh $SSH_OPTS "$HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/server-next-check.sh'"; then
            echo "::error::Deploy REJECTED — files rolled back. Live Passenger was NOT restarted."
          else
            echo "::error::Rollback completed but next.prepare() still fails."
            echo "::error::Check cPanel: Application mode = Production, startup file = app.js, Node 20+."
          fi
          exit 1

      - name: Restart Passenger app
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          ssh $SSH_OPTS "$HOST" \
            "mkdir -p '${DEPLOY_PATH}/tmp' && rm -f '${DEPLOY_PATH}/tmp/restart.txt' && touch '${DEPLOY_PATH}/tmp/restart.txt' && ls -la '${DEPLOY_PATH}/tmp/restart.txt' && (command -v cloudlinux-selector >/dev/null && cloudlinux-selector restart --json --interpreter nodejs --app-root '${DEPLOY_PATH}' || true)"

          echo "Waiting for Passenger cold start..."
          # Double-quote SITE_URL so bash expands it (single quotes caused curl "Bad hostname").
          # Use a real browser UA/Accept so hosting-level bot/security filters don't
          # misclassify this health check differently than actual visitor traffic.
          BROWSER_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          code="000"
          for attempt in 1 2 3; do
            sleep 12
            code="$(curl -sS -o /tmp/xoar-live.html -D /tmp/xoar-live-headers.txt -w '%{http_code}' --max-time 25 \
              -A "${BROWSER_UA}" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: en,ar;q=0.9" \
              "${SITE_URL}/en" || echo err)"
            echo "live_http_attempt_${attempt}=${code} url=${SITE_URL}/en"
            if [ "${code}" = "200" ] || [ "${code}" = "301" ] || [ "${code}" = "302" ] || [ "${code}" = "308" ]; then
              echo "Live site healthy after Passenger restart (HTTP ${code}, attempt ${attempt})."
              exit 0
            fi
          done

          echo "::warning::Live site returned ${code} after retries — collecting Passenger diagnostics (no auto-rollback)"
          echo "-- response headers --"
          cat /tmp/xoar-live-headers.txt 2>/dev/null || true
          echo "-- response body (first 1200 bytes) --"
          head -c 1200 /tmp/xoar-live.html || true
          ssh $SSH_OPTS "$HOST" \
            "chmod +x '${DEPLOY_PATH}/scripts/passenger-diag.sh' && DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/passenger-diag.sh'" \
            | tee /tmp/passenger-diag.txt || true

          # Only annotate real failure signals (avoid matching comments in server.js).
          if [ -f /tmp/passenger-diag.txt ]; then
            grep -E 'prepare-fail|prepare-exit=|server-boot-exit=|MODULE_NOT_FOUND|Error:|EADDRINUSE|xoar-boot|BUILD_ID=missing|Could not|cannot|App .* exit|passenger' /tmp/passenger-diag.txt \
              | head -n 40 \
              | while IFS= read -r line; do
                  echo "::error::diag: ${line}"
                done || true
          fi

          # Always surface the Passenger app log if present.
          ssh $SSH_OPTS "$HOST" "tail -n 60 '${DEPLOY_PATH}/passenger.log' 2>/dev/null || true" \
            | tee /tmp/passenger-app.log || true
          if [ -f /tmp/passenger-app.log ]; then
            head -n 40 /tmp/passenger-app.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::passenger.log: ${line}"
            done || true
          fi

          echo "::error::Passenger/live site unhealthy after restart (HTTP ${code}). See diagnostics above."
          echo "::error::In cPanel → Setup Node.js App → Stop → Start the app, then check logs."
          exit 1

      - name: Tail server logs (best effort)
        if: failure()
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          ssh $SSH_OPTS "$HOST" "TERM=dumb bash -c '
            set +e
            echo \"== server diagnostics (best effort) ==\"
            echo \"whoami=$(whoami)\"; echo \"pwd=$(pwd)\"; echo \"home=$HOME\"
            echo \"DEPLOY_PATH=${DEPLOY_PATH}\"
            echo
            echo \"-- ls: \$HOME/logs --\"
            ls -la \"\$HOME/logs\" 2>/dev/null || true
            LATEST_LOG=\$(ls -1t \"\$HOME/logs/\"*xoraevents* 2>/dev/null | head -n 1 || true)
            if [ -n \"\$LATEST_LOG\" ]; then
              echo \"---- tail latest domain log: \$LATEST_LOG ----\"
              (zcat -f \"\$LATEST_LOG\" 2>/dev/null || cat \"\$LATEST_LOG\" 2>/dev/null) | tail -n 120 || true
            fi
            echo \"-- ls: ${DEPLOY_PATH}/tmp --\"
            ls -la \"${DEPLOY_PATH}/tmp\" 2>/dev/null || true
            echo
            echo \"-- nodevenv locations --\"
            ls -la \"\$HOME/nodevenv\" 2>/dev/null || true
            ls -la \"\$HOME/nodevenv/public_html/xoraevents.com/xoar\" 2>/dev/null || true
            ls -la \"\$HOME/nodevenv/public_html/xoraevents.com/xoar/24\" 2>/dev/null || true
            ls -la \"\$HOME/nodevenv/public_html/xoraevents.com/xoar/24/var\" 2>/dev/null || true
            ls -la \"\$HOME/nodevenv/public_html/xoraevents.com/xoar/24/var/log\" 2>/dev/null || true
            echo
            echo \"== tail candidate logs ==\"
            CANDIDATES=(
              \"\$HOME/logs/error_log\"
              \"\$HOME/logs/passenger.log\"
              \"\$HOME/logs/stderr.log\"
              \"\$HOME/logs/stdout.log\"
              \"\$HOME/nodevenv/public_html/xoraevents.com/xoar/24/var/log/error.log\"
              \"\$HOME/nodevenv/public_html/xoraevents.com/xoar/24/var/log/passenger.log\"
              \"\$HOME/nodevenv/public_html/xoraevents.com/xoar/24/var/log/stderr.log\"
              \"\$HOME/nodevenv/public_html/xoraevents.com/xoar/24/var/log/stdout.log\"
              \"${DEPLOY_PATH}/tmp/passenger-error.log\"
              \"${DEPLOY_PATH}/tmp/stderr.log\"
              \"${DEPLOY_PATH}/tmp/stdout.log\"
              \"${DEPLOY_PATH}/passenger.log\"
              \"${DEPLOY_PATH}/stderr.log\"
              \"${DEPLOY_PATH}/stdout.log\"
            )
            for f in \"\${CANDIDATES[@]}\"; do
              if [ -f \"\$f\" ]; then
                echo \"---- tail: \$f ----\"
                tail -n 160 \"\$f\" 2>/dev/null || true
              fi
            done
          '"

      - name: Verify remote files
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"
          LOCAL_BUILD_ID="$(cat .next/BUILD_ID)"

          REMOTE_BUILD_ID="$(ssh $SSH_OPTS "$HOST" "cat '${DEPLOY_PATH}/.next/BUILD_ID'")"
          echo "Local  BUILD_ID=${LOCAL_BUILD_ID}"
          echo "Remote BUILD_ID=${REMOTE_BUILD_ID}"

          if [ "${LOCAL_BUILD_ID}" != "${REMOTE_BUILD_ID}" ]; then
            echo "::error::BUILD_ID mismatch after deploy — rsync may have failed partially."
            exit 1
          fi

          ssh $SSH_OPTS "$HOST" "chmod +x '${DEPLOY_PATH}/scripts/verify-deployment.sh' && DEPLOY_PATH='${DEPLOY_PATH}' MODE=local '${DEPLOY_PATH}/scripts/verify-deployment.sh'"

      - name: Smoke test live site (rollback on failure)
        if: false
        run: |
          set -euo pipefail
          chmod +x scripts/verify-deployment.sh
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          echo "Waiting for Passenger cold start (120s)..."
          sleep 120

          if DEPLOY_PATH="${DEPLOY_PATH}" SITE_URL="${SITE_URL}" API_URL="${API_PROXY_TARGET}" \
            scripts/verify-deployment.sh http; then
            echo "Deploy accepted — live site is healthy."
            exit 0
          fi

          echo "::warning::Smoke test failed — restoring previous live release (automatic rollback)."
          ssh $SSH_OPTS "$HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' '${DEPLOY_PATH}/scripts/rollback-deployment.sh'"

          echo "Waiting for Passenger after rollback (45s)..."
          sleep 45

          if DEPLOY_PATH="${DEPLOY_PATH}" SITE_URL="${SITE_URL}" API_URL="${API_PROXY_TARGET}" \
            scripts/verify-deployment.sh http; then
            echo "::error::This deploy was REJECTED and rolled back. The previous version is live again."
          else
            echo "::error::Rollback ran but site is still unhealthy — check cPanel Node.js logs manually."
          fi

          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          ssh $SSH_OPTS "$HOST" "TERM=dumb bash -c '
            set +e
            echo \"== diagnostics after failed deploy ==\"
            ls -la \"${DEPLOY_PATH}/tmp\" 2>/dev/null || true
            LATEST_LOG=\$(ls -1t \"\$HOME/logs/\"*xoraevents* 2>/dev/null | head -n 1 || true)
            if [ -n \"\$LATEST_LOG\" ]; then
              echo \"---- tail: \$LATEST_LOG ----\"
              (zcat -f \"\$LATEST_LOG\" 2>/dev/null || cat \"\$LATEST_LOG\" 2>/dev/null) | tail -n 120 || true
            fi
          '"

          exit 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-logs
          path: |
            .next/trace
            npm-debug.log*
          if-no-files-found: ignore

