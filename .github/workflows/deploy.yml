name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/cjfyc2evye0k/public_html/xoraevents.com/xoar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure production URLs
        run: |
          echo "API_PROXY_TARGET=https://xoraplus.com" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_ADMIN_URL=https://xoraplus.com" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_PORTAL_URL=https://xoraplus.com" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SITE_URL=https://xoraevents.com" >> $GITHUB_ENV

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production
          SKIP_API_DURING_BUILD: "1"

      - name: Prune dev dependencies for production
        run: npm prune --omit=dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy build artifacts to server
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          ssh $SSH_OPTS "$HOST" "mkdir -p ${DEPLOY_PATH}/.next ${DEPLOY_PATH}/public"

          rsync -avz --delete -e "ssh $SSH_OPTS" \
            .next/ "$HOST:${DEPLOY_PATH}/.next/"

          rsync -avz --delete -e "ssh $SSH_OPTS" \
            public/ "$HOST:${DEPLOY_PATH}/public/"

          rsync -avz -e "ssh $SSH_OPTS" \
            package.json package-lock.json next.config.mjs server.js \
            "$HOST:${DEPLOY_PATH}/"

          # cPanel SSH shell often has no npm in PATH — ship node_modules from CI instead.
          rsync -avz --delete -e "ssh $SSH_OPTS" \
            node_modules/ "$HOST:${DEPLOY_PATH}/node_modules/"

      - name: Restart Passenger app
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          ssh $SSH_OPTS ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${DEPLOY_PATH}/tmp && touch ${DEPLOY_PATH}/tmp/restart.txt"

      - name: Verify deployment
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes"
          echo "Remote BUILD_ID:"
          ssh $SSH_OPTS ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cat ${DEPLOY_PATH}/.next/BUILD_ID"
          echo "cPanel: startup file=server.js, Node 20+, env API_PROXY_TARGET=https://xoraplus.com"

      - name: Smoke test live API
        run: |
          API="${{ secrets.API_PROXY_TARGET }}"
          if [ -z "$API" ]; then
            API="https://xoraplus.com"
          fi
          echo "Testing ${API}/api/activities/ar?per_page=1"
          curl -fsS "${API}/api/activities/ar?per_page=1" | head -c 200
          echo ""
